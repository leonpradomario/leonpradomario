<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Terminal: building robots in public">
  <defs>
    <clipPath id="t1"><rect x="0" y="0" width="0" height="120"><animate attributeName="width" values="0;0;330;330;330;0" keyTimes="0;0.02;0.28;0.60;0.62;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="0" width="0" height="120"><animate attributeName="width" values="0;0;480;480;0;0" keyTimes="0;0.64;0.90;0.96;0.98;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="900" height="120" rx="12" fill="#0E1726"/>
  <rect x="0" y="0" width="900" height="120" rx="12" fill="none" stroke="#1E2A3D" stroke-width="1"/>
  <circle cx="26" cy="26" r="5" fill="#FF5F57"/>
  <circle cx="44" cy="26" r="5" fill="#FFA53D"/>
  <circle cx="62" cy="26" r="5" fill="#74D93F"/>
  <text x="26" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#74D93F">mario@lima</text>
  <text x="140" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#6149B0">~</text>
  <text x="160" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#FFFFFF">$</text>
  <g clip-path="url(#t1)"><text x="180" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#FFFFFF">whoami</text></g>
  <g clip-path="url(#t2)"><text x="180" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#FFFFFF">./build --in-public</text></g>
  <text x="26" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8A97AB" opacity="0">mechatronics engineer &#183; robots, automation, ROS 2<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.34;0.56;0.60;1" dur="14s" repeatCount="indefinite"/></text>
  <rect x="180" y="58" width="10" height="19" fill="#74D93F">
    <animate attributeName="x" values="180;282;282;180;282;372;372;180" keyTimes="0;0.28;0.60;0.62;0.64;0.90;0.96;1" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0;1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
